<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Studify</title>
  
  <!-- PWA Manifest & App Metas -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#0B1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studify">
  <meta name="application-name" content="Studify">

  <script>
    // Smart PWA Router
    try {
      const isManager = (localStorage.getItem("ca_admin_session") === "1") || 
        ((localStorage.getItem("ca_auth_v2") === "1" || localStorage.getItem("ca_auth_v1") === "1") && 
         (localStorage.getItem("ca_role_v1") === "admin" || localStorage.getItem("ca_role") === "admin"));

      if (isManager) {
        window.location.replace("./admin/admin.html");
      } else {
        window.location.replace("./assistant/index.html");
      }
    } catch(e) {
      window.location.replace("./assistant/index.html");
    }
  </script>
  <meta name="apple-touch-fullscreen" content="yes">
</head>
<body style="background:#0B1120; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; color:#94a3b8; font-family:sans-serif; overflow:hidden;">
  <div style="text-align:center;">
    <div style="width:44px; height:44px; border:3px solid rgba(56,189,248,0.2); border-top-color:#38bdf8; border-radius:50%; animation:studifySpin 0.75s linear infinite; margin:0 auto 16px;"></div>
    <div style="font-size:1.15em; font-weight:800; color:#f8fafc; letter-spacing:0.5px;">Studify</div>
    <p style="font-size:0.85em; color:#64748b; margin-top:6px;">جاري تشغيل النظام...</p>
  </div>
  <style>@keyframes studifySpin { to { transform: rotate(360deg); } }</style>
</body>
</html>
